<!-- Wazuh Agent Configuration Snippet (ossec.conf) -->
<!-- Location on Kali Agent: /var/ossec/etc/ossec.conf -->

<ossec_config>
  <client>
    <server>
      <!-- REPLACE WITH YOUR WAZUH MANAGER IP -->
      <address>192.168.100.10</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- ========================================== -->
  <!-- FILE INTEGRITY MONITORING (SYSCHECK / FIM) -->
  <!-- ========================================== -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- Real-time monitoring on critical system directories -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc,/usr/bin,/usr/sbin,/bin,/sbin</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/root/.ssh,/home/*/.ssh</directories>

    <!-- Files to ignore (frequently modified temp logs) -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
  </syscheck>

  <!-- ========================================== -->
  <!-- LOG ANALYSIS & EVENT INGESTION             -->
  <!-- ========================================== -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- Command Output Monitoring: Check for listening network sockets -->
  <wodle name="command">
    <disabled>no</disabled>
    <tag>listening-ports</tag>
    <command>ss -tulpn</command>
    <interval>10m</interval>
    <run_on_start>yes</run_on_start>
  </wodle>

</ossec_config>
